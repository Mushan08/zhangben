<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>记账本</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F8F6">
<meta name="color-scheme" content="light dark">

<!-- 首帧前就把主题/字体设好，避免暗色或大字号下闪一下默认样式 -->
<script>
(function () {
  try {
    var d = JSON.parse(localStorage.getItem('mozhang.v2') || 'null');
    var s = (d && d.settings) || {};
    var dark = s.theme === 'dark' ||
      (s.theme !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    var h = document.documentElement;
    h.setAttribute('data-theme', dark ? 'dark' : 'light');
    if (s.accent) h.setAttribute('data-accent', s.accent);
    if (s.font) h.setAttribute('data-font', s.font);
    if (s.fontScale) h.style.setProperty('--fsz', String(s.fontScale));
    var BG = {
      cinnabar: dark ? '#0F1211' : '#F7F8F6',
      jade:     dark ? '#0C1410' : '#EFF5EF',
      indigo:   dark ? '#0D1119' : '#F0F3F9',
      violet:   dark ? '#120F18' : '#F5F3F9',
      amber:    dark ? '#14100A' : '#F8F2E6'
    };
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', BG[s.accent] || BG.cinnabar);
  } catch (e) { /* 首帧脚本失败就交给 app.js 兜底 */ }
})();
</script>

<!-- 加到 iOS 主屏幕后，用独立窗口全屏运行 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账本">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="stage">
  <div class="phone" id="phone">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar"></nav>
  </div>
</div>

<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
